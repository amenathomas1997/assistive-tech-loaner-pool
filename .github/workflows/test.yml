name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the suite without pushing, e.g. to confirm a
  # change in the hosting environment has not broken anything.
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} / ${{ matrix.db.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']
        db:
          # The schema is written to work on both engines, and the differences
          # between them (CHECK constraints, ADD COLUMN IF NOT EXISTS, strict
          # GROUP BY) are exactly the ones that break silently. Test both.
          - name: MariaDB 10.6
            image: mariadb:10.6
          - name: MySQL 8.0
            image: mysql:8.0
        exclude:
          # One engine per version is enough through the middle of the matrix;
          # the oldest and newest supported PHP get both. 8.0 is the floor
          # because the code uses match(), named arguments and union types.
          - php: '8.2'
            db: { name: MySQL 8.0, image: 'mysql:8.0' }

    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MARIADB_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: loanerpool_test
          MYSQL_USER: loaner
          MYSQL_PASSWORD: loanerpooldev
          MARIADB_DATABASE: loanerpool_test
          MARIADB_USER: loaner
          MARIADB_PASSWORD: loanerpooldev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized || mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Exactly what app/bootstrap.php checks for at run time. There is no
          # Composer in this project: these are the only dependencies.
          extensions: pdo, pdo_mysql, mbstring, json, openssl
          coverage: none

      - name: Wait for the database
        run: |
          for i in $(seq 1 40); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -prootpassword --silent 2>/dev/null; then
              echo "database is up"
              exit 0
            fi
            sleep 2
          done
          echo "database did not become ready" >&2
          exit 1

      - name: Grant the test user rights to drop and recreate its database
        # The suite drops and recreates the schema on every run, which needs
        # more than the rights the service container grants by default.
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -prootpassword -e "
            GRANT ALL PRIVILEGES ON *.* TO 'loaner'@'%';
            FLUSH PRIVILEGES;"

      - name: Verify the barcode encoders
        # Runs standalone, with no database. The Code 128 and Code 39 tables
        # are hand-transcribed, and a single mistyped digit produces a label
        # that renders perfectly and scans as the wrong value.
        run: php scripts/verify-barcode.php

      - name: Run the full suite
        env:
          LP_DB_HOST: 127.0.0.1
          LP_DB_PORT: '3306'
          LP_DB_USER: loaner
          LP_DB_PASS: loanerpooldev
          LP_DB_NAME: loanerpool_test
          LP_MYSQL_BIN: mysql
          LP_PORT: '3000'
        run: ./scripts/reset-and-test.sh

      - name: Show the server log if anything failed
        if: failure()
        run: |
          echo "--- server log ---"
          cat /tmp/loaner-test-server.log || echo "(no log)"

  qr:
    name: QR round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          coverage: none

      # The only place Node appears in this project: the QR encoder is checked
      # by decoding its own output with an independent library. An encoder
      # verified only against itself is verified against nothing — this caught
      # a transposed Reed-Solomon generator polynomial that produced symbols
      # which looked perfect and decoded on no reader at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode generated symbols with jsQR
        run: ./scripts/verify-qr.sh

  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse every PHP file
        # There is no build step, so the files that ship are the files that
        # run. Checked against the lowest supported version, because a syntax
        # feature added in 8.1 parses fine locally and fails on the host.
        run: |
          failed=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || { echo "FAILED: $file"; failed=1; }
          done < <(find app public scripts bin -name '*.php')
          exit $failed

      - name: Parse every JavaScript file
        run: |
          failed=0
          while IFS= read -r file; do
            node --check "$file" || { echo "FAILED: $file"; failed=1; }
          done < <(find public scripts -name '*.js' ! -path '*/vendor/*')
          exit $failed
